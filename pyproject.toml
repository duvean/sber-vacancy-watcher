[project]
name = "sber-vacancy-watcher"
version = "0.1.0"
description = "Asynchronous Sber vacancies watcher with Telegram notifications"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "celery>=5.4,<6.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Alembic scripts are runtime files, not an importable distribution package.
# Explicit discovery prevents setuptools from treating both `app` and `alembic`
# as top-level Python packages during Docker builds.
[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
