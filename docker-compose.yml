x-app-environment: &app-environment
  # A local .env is read by Docker Compose automatically and overrides these defaults.
  # This lets the stack start before a Telegram token has been configured.
  APP_NAME: "${APP_NAME:-Sber Vacancy Watcher}"
  DEBUG: "${DEBUG:-false}"
  DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/vacancies}"
  CELERY_BROKER_URL: "${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}"
  CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-rpc://}"
  SBER_API_URL: "${SBER_API_URL:-https://rabota.sber.ru/public/app-candidate-public-api-gateway/api/v1/publications}"
  SBER_PAGE_SIZE: "${SBER_PAGE_SIZE:-50}"
  CHECK_INTERVAL_MINUTES: "${CHECK_INTERVAL_MINUTES:-15}"
  TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
  TELEGRAM_API_URL: "${TELEGRAM_API_URL:-https://api.telegram.org}"

services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vacancies
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vacancies"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment: *app-environment
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    environment: *app-environment
    command: celery -A app.core.celery_app worker --loglevel=INFO
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  beat:
    build: .
    environment: *app-environment
    command: celery -A app.core.celery_app beat --loglevel=INFO
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
